# ──────────────────────────────────────────────────────────────────────────────
# Variables à configurer dans GitLab : Settings → CI/CD → Variables
# ──────────────────────────────────────────────────────────────────────────────
# GCP_PROJECT_ID           ID du projet GCP                    (protected)
# GCP_SERVICE_ACCOUNT_KEY  JSON du compte de service GCP       (masked + protected)
# FIREBASE_TOKEN           Obtenu via : firebase login:ci       (masked + protected)
#
# Secrets à créer dans Google Secret Manager :
# db-url-dev        → URL JDBC Cloud SQL dev
# db-password-dev   → Mot de passe DB dev
# db-url-prod       → URL JDBC Cloud SQL prod
# db-password-prod  → Mot de passe DB prod
# jwt-secret-prod   → Clé JWT production (min 32 caractères)
# ──────────────────────────────────────────────────────────────────────────────

stages:
  - test
  - build
  - deploy-dev
  - deploy-prod

variables:
  GCP_REGION: europe-west1
  BACKEND_IMAGE: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/loan-management/backend

# ─── Auth GCP (réutilisé par tous les jobs cloud) ────────────────────────────

.gcloud-auth: &gcloud-auth
  before_script:
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

# ─── TESTS ───────────────────────────────────────────────────────────────────

test-backend:
  stage: test
  image: maven:3.9-amazoncorretto-17
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_DATABASE: loan_test
        MYSQL_USER: app
        MYSQL_PASSWORD: app
        MYSQL_ROOT_PASSWORD: root
  variables:
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/loan_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
    SPRING_DATASOURCE_USERNAME: app
    SPRING_DATASOURCE_PASSWORD: app
  script:
    - cd backend && mvn test -B -Dspring.profiles.active=test
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths: [backend/.m2/]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend && npm ci --cache .npm && npm run build -- --configuration=production
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths: [frontend/.npm/]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── BUILD ───────────────────────────────────────────────────────────────────

build-backend:
  stage: build
  image: google/cloud-sdk:alpine
  services:
    - name: docker:26-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache docker-cli
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet
  script:
    - docker build
        -t "${BACKEND_IMAGE}:${CI_COMMIT_SHA}"
        -t "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}"
        ./backend
    - docker push "${BACKEND_IMAGE}:${CI_COMMIT_SHA}"
    - docker push "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend && npm ci --cache .npm && npm run build -- --configuration=production
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths: [frontend/.npm/]
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"

# ─── DEPLOY DEV — automatique sur develop ────────────────────────────────────

deploy-backend-dev:
  stage: deploy-dev
  image: google/cloud-sdk:alpine
  <<: *gcloud-auth
  script:
    - |
      gcloud run deploy backend-dev \
        --image="${BACKEND_IMAGE}:${CI_COMMIT_SHA}" \
        --region="${GCP_REGION}" \
        --platform=managed \
        --min-instances=0 \
        --max-instances=5 \
        --add-cloudsql-instances="projet-fil-rouge-app:europe-west1:loan-management-sql" \
        --set-env-vars="SPRING_PROFILES_ACTIVE=dev,SPRING_DATASOURCE_USERNAME=app" \
        --set-secrets="SPRING_DATASOURCE_URL=db-url-dev:latest,SPRING_DATASOURCE_PASSWORD=db-password-dev:latest" \
        --allow-unauthenticated \
        --quiet
  environment:
    name: dev/backend
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"

deploy-frontend-dev:
  stage: deploy-dev
  image: node:20-alpine
  needs: [build-frontend]
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase deploy --only hosting:pfr-dev --project="$FIREBASE_PROJECT_ID" --token="$FIREBASE_TOKEN" --non-interactive
  environment:
    name: dev/frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"

# ─── DEPLOY PROD — manuel sur main ───────────────────────────────────────────

deploy-backend-prod:
  stage: deploy-prod
  image: google/cloud-sdk:alpine
  <<: *gcloud-auth
  script:
    - |
      gcloud run deploy backend-prod \
        --image="${BACKEND_IMAGE}:${CI_COMMIT_SHA}" \
        --region="${GCP_REGION}" \
        --platform=managed \
        --min-instances=1 \
        --max-instances=20 \
        --add-cloudsql-instances="projet-fil-rouge-app:europe-west1:loan-management-sql" \
        --set-env-vars="SPRING_PROFILES_ACTIVE=prod,SPRING_DATASOURCE_USERNAME=app" \
        --set-secrets="SPRING_DATASOURCE_URL=db-url-prod:latest,SPRING_DATASOURCE_PASSWORD=db-password-prod:latest,JWT_SECRET=jwt-secret-prod:latest" \
        --allow-unauthenticated \
        --quiet
  environment:
    name: prod/backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
  when: manual

deploy-frontend-prod:
  stage: deploy-prod
  image: node:20-alpine
  needs: [build-frontend]
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase deploy --only hosting:pfr-prod --project="$FIREBASE_PROJECT_ID" --token="$FIREBASE_TOKEN" --non-interactive
  environment:
    name: prod/frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/ci-cd-setup"
  when: manual
