# SonarQube local — usage: docker compose -f docker-compose.sonar.yml up -d
# UI: http://localhost:9000  (admin / admin au premier lancement, à changer)
# Puis créer un token : My Account → Security → Generate Token

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: loan-management-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
