<div class="page">
  <div class="card">
    @if (verified) {
      <div class="status-icon success">✓</div>
      <h2>E-mail vérifié !</h2>
      <p>Votre compte est actif. Redirection vers la connexion…</p>
      <a mat-raised-button color="primary" routerLink="/login">Se connecter</a>
    } @else {
      <div class="status-icon pending">✉</div>
      <h2>Vérifiez votre e-mail</h2>
      <p>Nous avons envoyé un lien à votre adresse. Saisissez le code reçu ci-dessous.</p>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Code de vérification</mat-label>
        <input matInput [(ngModel)]="token" placeholder="Collez votre code ici" />
      </mat-form-field>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button
        mat-raised-button
        color="primary"
        (click)="verify()"
        [disabled]="loading || !token.trim()"
      >
        {{ loading ? 'Vérification...' : 'Vérifier mon compte' }}
      </button>

      <p class="footer">
        <a routerLink="/login">Retour à la connexion</a>
      </p>
    }
  </div>
</div>
