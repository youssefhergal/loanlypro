@if (loading()) {
  <p class="loading">Chargement du dossier…</p>
} @else if (loadError()) {
  <p class="error-banner">{{ loadError() }}</p>
  <a mat-button routerLink="/mes-demandes">Retour à mes demandes</a>
} @else {
  <div class="wizard-toolbar">
    <a mat-button routerLink="/mes-demandes">
      <mat-icon>arrow_back</mat-icon>
      Mes demandes
    </a>
    @if (state.reference()) {
      <span class="ref-badge">{{ state.reference() }}</span>
    }
    <button mat-stroked-button type="button" (click)="saveAndQuit()" [disabled]="state.isSaving()">
      Enregistrer et quitter
    </button>
  </div>

  <mat-stepper
    [linear]="false"
    [selectedIndex]="state.currentStep()"
    (selectionChange)="onStepChange($event)"
    class="loan-stepper"
  >
    <mat-step label="Besoin">
      <app-step-need />
      <div class="step-actions">
        <button mat-flat-button color="primary" type="button" (click)="goNext(0)" [disabled]="state.isSaving()">
          Suivant
        </button>
      </div>
    </mat-step>

    <mat-step label="Situation">
      <app-step-situation />
      <div class="step-actions">
        <button mat-button type="button" (click)="goBack(1)">Précédent</button>
        <button mat-flat-button color="primary" type="button" (click)="goNext(1)" [disabled]="state.isSaving()">
          Suivant
        </button>
      </div>
    </mat-step>

    <mat-step label="Documents">
      <app-step-documents />
      <div class="step-actions">
        <button mat-button type="button" (click)="goBack(2)">Précédent</button>
        <button mat-flat-button color="primary" type="button" (click)="goNext(2)">Suivant</button>
      </div>
    </mat-step>

    <mat-step label="Récapitulatif">
      <app-step-summary />
      <div class="step-actions">
        <button mat-button type="button" (click)="goBack(3)">Précédent</button>
        <button
          mat-flat-button
          color="primary"
          type="button"
          (click)="submit()"
          [disabled]="state.isSaving() || state.isSubmitting()"
        >
          Soumettre la demande
        </button>
      </div>
    </mat-step>
  </mat-stepper>
}
