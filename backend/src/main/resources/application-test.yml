# Profil tests — H2 en mémoire (pas de MySQL requis pour mvn test / SonarQube)

spring:
  datasource:
    url: jdbc:h2:mem:loan_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  advisor-assignment:
    scheduler:
      enabled: false
  repayment:
    scheduler:
      enabled: false
