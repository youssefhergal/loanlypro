# Profil production — activer avec SPRING_PROFILES_ACTIVE=prod

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://pfr-prod.web.app}
  advisor-assignment:
    scheduler:
      enabled: true
      cron: "0 0 * * * *"

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
