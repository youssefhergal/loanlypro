# Configuration commune — profil actif : dev (voir application-dev.yml / application-prod.yml)

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: loanmanagement
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyChangeInProductionMinimum32Characters}
    expiration-ms: 86400000
  storage:
    loan-documents-dir: ${LOAN_DOCUMENTS_DIR:uploads/loan-documents}
  advisor-assignment:
    scheduler:
      enabled: true
      cron: "0 0 * * * *"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
